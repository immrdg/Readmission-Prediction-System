<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Doctor Login</title>
  <style>
    body{font-family:Arial;background:#f4f7f9;margin:0;display:flex;align-items:center;justify-content:center;height:100vh}
    .card{background:#fff;padding:24px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.08);width:360px}
    h2{margin:0 0 16px;color:#0a3d62}
    label{display:block;margin:10px 0 6px}
    input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px}
    button{margin-top:14px;width:100%;padding:12px;border:none;background:#0a3d62;color:#fff;border-radius:6px;cursor:pointer}
    a{display:inline-block;margin-top:10px;color:#0a3d62;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>Doctor Login</h2>
    <form method="post">
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Password</label>
      <input type="password" name="password" required>
      <button type="submit">Sign in</button>
    </form>
    <a href="{{ url_for('login') }}">Back to Patient Login</a>
  </div>
</body>
</html>
