<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk Checkup</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      margin: 0;
      padding: 0;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1e88e5;
      padding: 15px 30px;
      color: white;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
    }

    .container h1 {
      text-align: center;
      color: #1e88e5;
      margin-bottom: 30px;
      font-size: 26px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px 30px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #333;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      background: #fdfdfd;
      transition: 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #1e88e5;
      outline: none;
      box-shadow: 0 0 5px rgba(30, 136, 229, 0.4);
    }

    .form-group button {
      grid-column: 1 / -1;
      padding: 14px;
      background-color: #1e88e5;
      color: white;
      font-size: 17px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .form-group button:hover {
      background-color: #1565c0;
    }

    .claims-container {
      grid-column: 1 / -1;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="navbar">
    <a href="/">Riskometer</a>
    <a href="/home">Home</a>
  </div>

  <div class="container">
    <h1>Risk Checkup</h1>
    <form action="/predict" method="POST" class="form-grid">

      <!-- Patient Demographics -->
      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" name="age" id="age" required>
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select name="gender" id="gender" required>
          <option value="1">Male</option>
          <option value="0">Female</option>
        </select>
      </div>

      <!-- Clinical Features -->
      <div class="form-group">
        <label for="rbc_count">RBC Count (3 - 8 mcL)</label>
        <input type="number" step="0.01" name="rbc_count" id="rbc_count" required>
      </div>

      <div class="form-group">
        <label for="wbc_count">WBC Count (4000 - 11000)</label>
        <input type="number" step="0.01" name="wbc_count" id="wbc_count" required>
      </div>

      <div class="form-group">
        <label for="systole">Systolic Blood Pressure (&lt;120 mmHg)</label>
        <input type="number" name="systole" id="systole" required>
      </div>

      <div class="form-group">
        <label for="diastole">Diastolic Blood Pressure (60-79 mmHg)</label>
        <input type="number" name="diastole" id="diastole" required>
      </div>

      <div class="form-group">
        <label for="heart_rate">Heart Rate (60 - 100 bpm)</label>
        <input type="number" name="heart_rate" id="heart_rate" required>
      </div>

      <div class="form-group">
        <label for="allergies">Allergies</label>
        <select name="allergies" id="allergies" required>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>

      <div class="form-group">
        <label for="blood_sugar">Blood Sugar Level (72 - 99 mg/dL)</label>
        <input type="number" step="0.01" name="blood_sugar" id="blood_sugar" required>
      </div>

      <div class="form-group">
        <label for="bmi">BMI (18.5 - 24.9)</label>
        <input type="number" step="0.01" name="bmi" id="bmi" required>
      </div>

      <div class="form-group">
        <label for="cholesterol">Cholesterol (mg/dL)</label>
        <input type="number" step="0.01" name="cholesterol" id="cholesterol" required>
      </div>

      <div class="form-group">
        <label for="glucose_mean">Glucose Level (mg/dL)</label>
        <input type="number" step="0.01" name="glucose_mean" id="glucose_mean" required>
      </div>

      <div class="form-group">
        <label for="hemoglobin_mean">Hemoglobin Level (g/dL)</label>
        <input type="number" step="0.01" name="hemoglobin_mean" id="hemoglobin_mean" required>
      </div>

      <!-- Lifestyle -->
      <div class="form-group">
        <label for="steps_per_day">Steps Per Day</label>
        <input type="number" name="steps_per_day" id="steps_per_day" required>
      </div>

      <div class="form-group">
        <label for="calorie_intake">Calorie Intake</label>
        <input type="number" name="calorie_intake" id="calorie_intake" required>
      </div>

      <div class="form-group">
        <label for="smoking">Smoking</label>
        <select name="smoking" id="smoking" required>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>

      <div class="form-group">
        <label for="alcohol">Alcohol</label>
        <select name="alcohol" id="alcohol" required>
          <option value="1">Yes</option>
          <option value="0">No</option>
        </select>
      </div>

      <div class="form-group">
        <label for="sleep_pattern">Sleep Pattern</label>
        <select name="sleep_pattern" id="sleep_pattern" required>
          <option value="1">Good</option>
          <option value="0">Poor</option>
        </select>
      </div>

      <!-- Claims -->
      <div class="form-group">
        <label for="num_claims">Number of Claims</label>
        <input type="number" name="num_claims" id="num_claims" required min="0" max="10">
      </div>

      <div class="form-group">
        <label for="service_type">Service Type</label>
        <input type="text" name="service_type" id="service_type" placeholder="e.g. surgery" required>
      </div>

      <div class="form-group">
        <label for="diagnosis_code">Diagnosis Code</label>
        <input type="text" name="diagnosis_code" id="diagnosis_code" placeholder="e.g. F32" required>
      </div>

      <div class="form-group">
        <label for="procedure_code">Procedure Code</label>
        <select name="procedure_code" id="procedure_code" required>
          <option value="P01">P01 (Routine Blood Test)</option>
          <option value="P02">P02 (Physical Exam)</option>
          <option value="P03">P03 (X-Ray Imaging)</option>
          <option value="P04">P04 (Minor Surgery)</option>
          <option value="P05">P05 (Major Surgery)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="cost_of_service">Cost of Service ($)</label>
        <input type="number" step="0.01" name="cost_of_service" id="cost_of_service" required>
      </div>

      <div class="form-group">
        <button type="submit">Submit</button>
      </div>
    </form>
  </div>
</body>
</html>
