<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="{{ url_for('static', filename='images/main.jpg') }}" type="image/gif">
    <title>HealthGuard - Create Account</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet"/>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
    <style>
        body {
            font-family: "Inter", "Poppins", sans-serif;
            background: var(--gradient-hero);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: var(--space-lg);
        }

        .auth-container {
            width: 100%;
            max-width: 550px;
            animation: fadeInUp 0.8s ease-out;
        }

        .auth-header {
            text-align: center;
            margin-bottom: var(--space-2xl);
            color: white;
        }

        .auth-header h1 {
            font-size: var(--text-3xl);
            font-weight: 700;
            margin-bottom: var(--space-sm);
            font-family: 'Playfair Display', serif;
        }

        .auth-header p {
            font-size: var(--text-lg);
            opacity: 0.9;
        }

        .auth-box {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: var(--space-2xl);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-2xl);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .auth-title {
            text-align: center;
            font-size: var(--text-2xl);
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--space-xl);
            font-family: 'Playfair Display', serif;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-lg);
        }

        @media (max-width: 640px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--text-sm);
        }

        .form-group input {
            padding: var(--space-md);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            font-size: var(--text-base);
            transition: all var(--transition-base);
            background: white;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-light);
        }

        .auth-actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .divider {
            text-align: center;
            color: var(--text-secondary);
            font-size: var(--text-sm);
            position: relative;
            margin: var(--space-lg) 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border-color);
            z-index: 1;
        }

        .divider span {
            background: white;
            padding: 0 var(--space-md);
            position: relative;
            z-index: 2;
        }

        .login-link {
            text-align: center;
            color: var(--text-secondary);
            font-size: var(--text-sm);
        }

        .login-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition-base);
        }

        .login-link a:hover {
            color: var(--primary-dark);
        }

        .back-home {
            position: absolute;
            top: var(--space-lg);
            left: var(--space-lg);
            color: white;
            text-decoration: none;
            font-size: var(--text-sm);
            font-weight: 500;
            transition: all var(--transition-base);
            z-index: 10;
        }

        .back-home:hover {
            color: var(--accent-light);
            transform: translateX(-4px);
        }
    </style>
</head>

<body>
    <!-- Back to Home Link -->
    <a href="{{ url_for('index') }}" class="back-home">
        <i class="fa fa-arrow-left" style="margin-right: 8px;"></i>
        Back to Home
    </a>

    <div class="auth-container">
        <!-- Auth Header -->
        <div class="auth-header">
            <h1>
                <i class="fa fa-heartbeat" style="margin-right: 12px;"></i>
                HealthGuard
            </h1>
            <p>Create your account to start your health journey.</p>
        </div>

        <!-- Auth Box -->
        <div class="auth-box">
            <h2 class="auth-title">
                <i class="fa fa-user-plus" style="margin-right: 8px; color: var(--secondary-color);"></i>
                Create Account
            </h2>
            
            <!-- Registration Form -->
            <form action="{{ url_for('register') }}" method="POST" class="auth-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">
                            <i class="fa fa-user" style="margin-right: 4px;"></i>
                            Full Name
                        </label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-group">
                        <label for="age">
                            <i class="fa fa-calendar" style="margin-right: 4px;"></i>
                            Age
                        </label>
                        <input type="number" id="age" name="age" placeholder="Enter your age" required min="1" max="120">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="email">
                        <i class="fa fa-envelope" style="margin-right: 4px;"></i>
                        Email Address
                    </label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>
                
                <div class="form-group">
                    <label for="mobile_number">
                        <i class="fa fa-phone" style="margin-right: 4px;"></i>
                        Mobile Number
                    </label>
                    <input type="tel" id="mobile_number" name="mobile_number" placeholder="Enter your mobile number" required>
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <i class="fa fa-lock" style="margin-right: 4px;"></i>
                        Password
                    </label>
                    <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                </div>
                
                <div class="auth-actions">
                    <button type="submit" class="btn-modern btn-secondary w-full">
                        <i class="fa fa-rocket" style="margin-right: 8px;"></i>
                        Create Account
                    </button>
                </div>
            </form>
            
            <div class="divider">
                <span>Already have an account?</span>
            </div>
            
            <div class="login-link">
                Welcome back! 
                <a href="{{ url_for('login') }}">
                    <i class="fa fa-sign-in" style="margin-right: 4px;"></i>
                    Sign in to your account
                </a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/jquery-3.4.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom.js') }}"></script>
</body>
</html>
