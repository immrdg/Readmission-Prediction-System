<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="{{ url_for('static', filename='images/main.jpg') }}" type="image/gif">
    <title>Forgot Password - Patient Risk Calculator</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link href="{{ url_for('static', filename='css/font-awesome.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
    <style>
        body {
            font-family: "Poppins", sans-serif;
            color: #0c0c0c;
            background-color: #2c889a;
            overflow-x: hidden;
        }
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to right, #184d47, #39babc);
        }
        .auth-box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease-in-out;
        }
        .auth-box:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        }
        .auth-box h2 {
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }
        .auth-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s ease-in-out;
        }
        .auth-box input:focus {
            border-color: #184d47;
            outline: none;
        }
        .auth-box button {
            width: 100%;
            padding: 10px;
            background: #184d47;
            border: none;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }
        .auth-box button:hover {
            background: #96bb7c;
        }
        .back-link {
            margin-top: 15px;
            color: #184d47;
            text-decoration: underline;
            cursor: pointer;
        }
        .back-link:hover {
            color: #96bb7c;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Forgot Password</h2>
            <form>
                <input type="email" placeholder="Enter your email address" required />
                <button type="submit">Reset Password</button>
            </form>
            <div class="back-link"><a href="{{ url_for('login') }}">Back to Login</a></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/jquery-3.4.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom.js') }}"></script>
</body>
</html>
