<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" href="{{ url_for('static', filename='images/main.jpg') }}" type="image/gif">
    <title>Register - Hospital Readmission Prediction and Prevention</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/responsive.css') }}" rel="stylesheet">
    <style>
        body {
            font-family: "Poppins", sans-serif;
            background-color: #f0f4f8;
            color: #333;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background-color: transparent;
            color: #ffffff;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            margin: 0;
            color: #ffffff;
            text-decoration: none;
        }

        .header .login-btn {
            background-color: #184d47; /* Background color for the login button */
            padding: 10px 20px;
            border-radius: 50px;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            transition: background-color 0.3s, transform 0.3s;
        }

        .header .login-btn:hover {
            background-color: #96bb7c; /* Change color on hover */
            transform: scale(1.05); /* Slightly increase size on hover */
        }

        .registration-form {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, opacity 0.3s;
            text-align: center;
        }

        .registration-form:hover {
            transform: translateY(-10px);
            opacity: 0.9;
        }

        .registration-form h2 {
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
            text-align: center;
            color: #184d47;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #96bb7c;
            outline: none;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #184d47;
        }

        .form-group .btn {
            width: 100%; /* Full width button */
            padding: 12px;
            background-color: #184d47; /* Background color for the register button */
            border: none;
            border-radius: 50px; /* Rounded corners */
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s, transform 0.3s;
            margin-top: 20px;
            text-align: center;
        }

        .form-group .btn:hover {
            background-color: #96bb7c; /* Change color on hover */
            transform: scale(1.05); /* Slightly increase size on hover */
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="{{ url_for('index') }}">
            <h1>Riskometer</h1>
        </a>
        <a href="{{ url_for('login') }}" class="login-btn">Login</a>
    </header>

    <div class="container">
        <div class="registration-form">
            <h2>Register</h2>
            <form action="{{ url_for('register') }}" method="POST">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="mobile_number">Mobile Number</label>
                    <input type="tel" id="mobile_number" name="mobile_number" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn">Register Now</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/jquery-3.4.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/bootstrap.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom.js') }}"></script>
</body>
</html>
