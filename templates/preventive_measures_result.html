<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preventive Measures</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f7fa;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: flex-start;
            background-color: #00695c;
            padding: 20px;
            color: white;
            font-size: 1.5em;
        }
        header a {
            color: white;
            text-decoration: none;
            font-size: 1.2em;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        ul {
            list-style-type: disc;
            margin: 20px 0;
            padding-left: 20px;
            font-size: 1.1em;
        }
        li {
            margin-bottom: 10px;
        }
        .btn {
            display: block;
            padding: 10px 20px;
            font-size: 1.1em;
            color: white;
            background-color: #00695c;
            border: none;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            margin: 40px auto 0 auto; /* Center the button */
            width: 50%; /* Adjust button width for better appearance */
        }
        .btn:hover {
            background-color: #004d40;
        }
    </style>
</head>
<body>

    <header>
        <a href="/home">Riskometer</a>
    </header>

    <div class="container">
        <ul>
            {% for measure in preventive_measures %}
                <li>{{ measure }}</li>
            {% endfor %}
        </ul>

        <a href="/home" class="btn">Back to Home</a>
    </div>

</body>
</html>
